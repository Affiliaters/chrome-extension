<!DOCTYPE html>
<html>
<head>
    <title>Affiliaters - All Conversions</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="dark-theme">
    <div class="dashboard-container">
        <nav class="top-nav">
            <div class="nav-left">
                <img src="images/logo.png" alt="Affiliaters" class="nav-logo">
            </div>
            <div class="nav-right">
                <button class="theme-toggle">
                    <i class="fas fa-sun"></i>
                </button>
                <button class="btn-logout">
                    <i class="fas fa-sign-out-alt"></i>
                    Logout
                </button>
            </div>
        </nav>
        
        <main class="main-content">
            <div class="page-header">
                <h1 class="page-title">All Conversions</h1>
            </div>
            <div class="history-actions-row">
                <button id="backBtn" class="btn-back">
                    <i class="fas fa-arrow-left"></i>
                    Back
                </button>
                <button id="clearAllHistoryBtn" class="btn-clear-history">
                    <i class="fas fa-trash"></i>
                    Clear
                </button>
            </div>
            <div id="allHistoryList" class="history-list">
                <!-- History items will be displayed here -->
            </div>
        </main>
    </div>
    <script src="../js/config.js"></script>
    <script src="../js/storage.js"></script>
    <script src="../js/all-conversions.js"></script>
</body>
</html>
