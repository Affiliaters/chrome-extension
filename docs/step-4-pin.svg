  <text x="92" y="50" font-size="22" font-weight="700" fill="#1f2937">Pin it &amp; open</text>
  <text x="92" y="76" font-size="14" fill="#6b7280">Click the puzzle icon, pin the extension, then click its icon to start.</text>

  <!-- browser window -->
  <rect x="40" y="104" width="640" height="164" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="40" y="104" width="640" height="40" rx="12" fill="#f3f5f8"/>
  <rect x="40" y="132" width="640" height="12" fill="#f3f5f8"/>
