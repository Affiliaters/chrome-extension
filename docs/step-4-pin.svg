  <circle cx="84" cy="124" r="6" fill="#febc2e"/>
  <circle cx="104" cy="124" r="6" fill="#28c840"/>

  <!-- toolbar with puzzle + pinned icon -->
  <rect x="556" y="112" width="26" height="24" rx="6" fill="#e5e7eb"/>
  <path d="M563 118 h4 v-3 a2 2 0 0 1 4 0 v3 h4 v4 h3 a2 2 0 0 1 0 4 h-3 v4 h-12 z" fill="#6b7280"/>
  <circle cx="606" cy="124" r="14" fill="#2563eb"/>
  <text x="606" y="129" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
  <circle cx="620" cy="112" r="9" fill="#16a34a"/>
  <path d="M615 112 l3 3 l6 -6" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- opened popup preview -->
