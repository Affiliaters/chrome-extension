  <rect x="470" y="150" width="170" height="30" rx="10" fill="#2563eb"/>
  <text x="555" y="170" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Deal Converter</text>
  <rect x="486" y="196" width="138" height="16" rx="4" fill="#eef2f7"/>
  <rect x="486" y="220" width="138" height="22" rx="6" fill="#2563eb"/>
  <text x="555" y="235" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">Convert</text>

  <text x="64" y="200" font-size="16" font-weight="700" fill="#16a34a">All set!</text>
  <text x="64" y="226" font-size="13" fill="#6b7280">The extension is installed and ready to use.</text>
