<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="720" height="300" rx="16" fill="#eef2f7"/>
  <circle cx="54" cy="54" r="24" fill="#2563eb"/>
  <text x="54" y="63" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="92" y="50" font-size="22" font-weight="700" fill="#1f2937">Download &amp; unzip</text>
  <text x="92" y="76" font-size="14" fill="#6b7280">On the repo page: click the green Code button, then Download ZIP, and unzip.</text>

  <!-- green Code button -->
  <rect x="44" y="120" width="120" height="34" rx="8" fill="#2da44e"/>
  <text x="70" y="142" font-size="13" font-weight="700" fill="#ffffff">&#60; &#62; Code</text>
  <text x="146" y="142" font-size="11" fill="#ffffff">&#9662;</text>

  <!-- dropdown with Download ZIP highlighted -->
  <rect x="44" y="160" width="230" height="96" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="60" y="184" font-size="12" fill="#6b7280">Clone</text>
  <line x1="56" y1="196" x2="262" y2="196" stroke="#eaedf0" stroke-width="1"/>
  <text x="60" y="216" font-size="12" fill="#9ca3af">Open with GitHub Desktop</text>
  <rect x="52" y="226" width="214" height="24" rx="6" fill="#eaf0ff" stroke="#2563eb"/>
  <text x="64" y="243" font-size="13" font-weight="700" fill="#1f2937">Download ZIP</text>

  <!-- arrow -->
  <line x1="300" y1="188" x2="352" y2="188" stroke="#9ca3af" stroke-width="6" stroke-linecap="round"/>
  <polygon points="352,176 376,188 352,200" fill="#9ca3af"/>

  <!-- unzipped folder -->
  <path d="M418 150 h52 l14 16 h188 a8 8 0 0 1 8 8 v52 a8 8 0 0 1 -8 8 h-254 a8 8 0 0 1 -8 -8 v-68 a8 8 0 0 1 8 -8 z" fill="#f0b429"/>
  <rect x="418" y="172" width="262" height="62" rx="8" fill="#f7c948"/>
  <text x="549" y="208" font-size="13" font-weight="700" fill="#7a5b00" text-anchor="middle">chrome-extension-</text>
  <text x="549" y="224" font-size="13" font-weight="700" fill="#7a5b00" text-anchor="middle">main</text>
  <text x="549" y="252" font-size="12" fill="#6b7280" text-anchor="middle">contains manifest.json</text>
</svg>
