<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="720" height="260" rx="16" fill="#eef2f7"/>
  <text x="40" y="46" font-size="20" font-weight="700" fill="#1f2937">Staying up to date</text>
  <text x="40" y="72" font-size="14" fill="#6b7280">The extension checks GitHub automatically. When a new version is out you'll see this:</text>

  <!-- popup with update banner -->
  <rect x="210" y="96" width="300" height="140" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <!-- banner -->
  <rect x="210" y="96" width="300" height="34" rx="12" fill="#2563eb"/>
  <rect x="210" y="118" width="300" height="12" fill="#2563eb"/>
  <path d="M228 108 a5 5 0 1 1 -3 -4" fill="none" stroke="#ffffff" stroke-width="2"/>
  <polygon points="225,101 232,101 228,96" fill="#ffffff"/>
  <text x="240" y="117" font-size="11.5" fill="#ffffff">New version 1.7 available.</text>
  <text x="432" y="117" font-size="11.5" font-weight="700" fill="#ffffff" text-decoration="underline">Download</text>
  <text x="494" y="118" font-size="15" fill="#ffffff">&#215;</text>
  <!-- body -->
  <rect x="230" y="150" width="260" height="16" rx="4" fill="#eef2f7"/>
  <rect x="230" y="176" width="260" height="40" rx="8" fill="#f3f5f8"/>
  <text x="360" y="201" font-size="12" fill="#9ca3af" text-anchor="middle">dashboard…</text>
</svg>
