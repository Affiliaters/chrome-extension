<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="720" height="300" rx="16" fill="#eef2f7"/>
  <circle cx="54" cy="54" r="24" fill="#2563eb"/>
  <text x="54" y="63" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="92" y="50" font-size="22" font-weight="700" fill="#1f2937">Load unpacked</text>
  <text x="92" y="76" font-size="14" fill="#6b7280">Click "Load unpacked" and pick the unzipped folder (the one with manifest.json).</text>

  <!-- browser window -->
  <rect x="40" y="104" width="640" height="164" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="40" y="104" width="640" height="40" rx="12" fill="#f3f5f8"/>
  <rect x="40" y="132" width="640" height="12" fill="#f3f5f8"/>
  <circle cx="64" cy="124" r="6" fill="#ff5f57"/>
  <circle cx="84" cy="124" r="6" fill="#febc2e"/>
  <circle cx="104" cy="124" r="6" fill="#28c840"/>

  <!-- toolbar buttons -->
  <rect x="64" y="164" width="150" height="34" rx="8" fill="#2563eb"/>
  <text x="139" y="186" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Load unpacked</text>
  <rect x="226" y="164" width="140" height="34" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="296" y="186" font-size="13" fill="#9ca3af" text-anchor="middle">Pack extension</text>
  <rect x="378" y="164" width="90" height="34" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="423" y="186" font-size="13" fill="#9ca3af" text-anchor="middle">Update</text>

  <!-- highlight ring + cursor -->
  <rect x="58" y="158" width="162" height="46" rx="11" fill="none" stroke="#16a34a" stroke-width="2.5"/>
  <path d="M150 210 l0 34 l9 -9 l6 13 l7 -3 l-6 -13 l12 0 z" fill="#111827" stroke="#ffffff" stroke-width="1.5"/>

  <text x="64" y="240" font-size="13" fill="#6b7280">A folder picker opens — select your unzipped extension folder.</text>
