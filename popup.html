<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Affiliaters Deal Converter</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="popup-container">
        <!-- First-run: pick a platform -->
        <div class="auth-container" id="sitePicker" style="display:none;">
            <div class="logo-container">
                <img src="images/logo.png" alt="Affiliaters Logo" class="logo">
            </div>
            <h2>Choose your platform</h2>
            <p>Select the account you want to use. You can switch anytime and stay logged into both.</p>
            <div class="button-group">
                <button class="btn-primary site-option" data-site="affiliaters">
                    <i class="fas fa-bolt"></i> Affiliaters
                </button>
                <button class="btn-primary btn-ekaro site-option" data-site="ekaro">
                    <i class="fas fa-leaf"></i> EK Affiliaters
                </button>
            </div>
        </div>

        <!-- Authorize the active site -->
        <div class="auth-container" id="authContainer" style="display:none;">
            <div class="logo-container">
                <img src="images/logo.png" alt="Affiliaters Logo" class="logo">
            </div>
            <h2 id="authTitle">Welcome</h2>
            <p id="authSubtitle">Please authorize the extension to continue.</p>
            <div class="button-group">
                <button id="authorizeBtn" class="btn-primary">
                    <i class="fas fa-key"></i> Authorize Extension
                </button>
                <a id="goToSiteBtn" href="#" target="_blank" class="btn-secondary">
                    <i class="fas fa-external-link-alt"></i> Go to site
                </a>
                <button id="switchSiteBtn" class="btn-secondary">
                    <i class="fas fa-exchange-alt"></i> Choose different platform
                </button>
            </div>
        </div>
    </div>
    <script src="config.js"></script>
    <script src="storage.js"></script>
    <script src="popup.js"></script>
</body>
</html>
